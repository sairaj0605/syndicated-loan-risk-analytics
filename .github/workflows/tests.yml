name: Validate analytics and publish dashboard
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analytics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install requirements
        run: python -m pip install -r requirements.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Execute analysis and dashboard generation
        run: python src/analyze.py
      - name: Publish dashboard screenshot
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p assets/screenshots
          cp output/portfolio_dashboard.png assets/screenshots/portfolio_dashboard.png
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/screenshots/portfolio_dashboard.png
          if ! git diff --cached --quiet; then
            git commit -m "Update generated syndicated lending dashboard [skip ci]"
            git push
          fi
      - name: Upload analytics outputs
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-lending-report
          path: output/
